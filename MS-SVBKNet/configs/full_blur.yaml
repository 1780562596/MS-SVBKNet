experiment:
  name: ms_svbknet_full_blur
  output_dir: runs
  seed: 3407
  deterministic: true
  device: cuda

data:
  root: /path/to/GOPRO_Large
  train_split: train
  val_split: train
  test_split: test
  train_index: train_index_blur.csv
  val_index: val_index_blur.csv
  test_index: ""
  blur_variant: blur
  enforce_index_variant: true
  persistent_workers: false
  enforce_scene_disjoint: true
  expected_trainval_pairs: 2103
  expected_test_pairs: 1111
  expected_trainval_scenes: 22
  expected_train_scenes: 18
  expected_val_scenes: 4
  expected_test_scenes: 11
  crop_size: 256
  num_workers: 8

model:
  base_channels: 50
  degradation_channels: 64
  num_kernels: 16
  kernel_size: 15
  use_mdrm: true
  fuse_mdrm_to_generator: true
  use_svbkm: true
  dictionary_mode: learned
  use_crcm: true
  discriminator_global_pool: true

loss:
  lambda_frequency: 0.10
  lambda_adversarial: 0.001
  lambda_reblur: 0.10
  cred_initial: 0.10
  cred_maximum: 3.0
  cred_momentum: 0.98
  reliability_alpha: 8.0
  detach_reliability: true
  gradient_penalty: 10.0
  gan_mode: wgan_gp

train:
  epochs: 300
  batch_size: 2
  lr_generator: 0.00005
  lr_discriminator: 0.00005
  lr_blur: 0.0001
  betas: [0.0, 0.9]
  grad_clip: 5.0
  amp: true
  preview_interval: 20
  max_steps_per_epoch: 0
  val_lpips: false

eval:
  tile: 0
  overlap: 64
  crop_border: 0
  color_space: rgb
  metric_protocol: gopro_matlab
  lpips: true
  lpips_backend: official_vgg16
  max_images: 0
